<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة الدكتور وليد | جراحة وتجميل الأنف والوجه</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #0b1329; color: #f8fafc; padding: 25px 15px 50px; }
    
    .header { text-align: center; margin-bottom: 30px; }
    .badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 5px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; margin-bottom: 10px; border: 1px solid rgba(56, 189, 248, 0.3); }
    .header h1 { font-size: 1.65rem; color: #ffffff; font-weight: 800; margin-bottom: 6px; }
    .header p { color: #94a3b8; font-size: 0.95rem; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background: #152238;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }
    .card img { width: 100%; height: 230px; object-fit: cover; background: #1e293b; }
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .card-desc { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; flex-grow: 1; line-height: 1.5; }
    
    .btn-wa {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #25d366; color: white; text-decoration: none;
      padding: 11px; border-radius: 10px; font-weight: 700; font-size: 0.92rem;
      transition: background 0.2s;
    }
    .btn-wa:active { background: #1eb954; }
  </style>
</head>
<body>

  <header class="header">
    <span class="badge">معرض الحالات والنتائج</span>
    <h1 id="doc-name">عيادة الدكتور وليد</h1>
    <p id="doc-title">أخصائي جراحة وتجميل الأنف والوجه</p>
  </header>

  <div class="gallery-grid" id="gallery-container">
    <p style="text-align: center; grid-column: 1/-1; color: #94a3b8;">جاري تحميل المعرض والحالات...</p>
  </div>

  <script>
    const BIN_ID = "6ad30887ac6210605a39214b";
    const MASTER_KEY = "$2a$10$l0XLZQqh12sZgN8L0NYNiOYHv.KmVzZA5xlyTKZowZh7IPvjlwqXq";
    const apiUrl = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

    async function loadGallery() {
      try {
        const res = await fetch(apiUrl, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        const json = await res.json();
        const data = json.record;
        
        if (data.doctor) {
          if (data.doctor.name) document.getElementById('doc-name').innerText = data.doctor.name;
          if (data.doctor.title) document.getElementById('doc-title').innerText = data.doctor.title;
        }

        const items = data.gallery || [];
        const container = document.getElementById('gallery-container');
        const phone = (data.doctor && data.doctor.phone) ? data.doctor.phone : "0934155337";

        if (items.length === 0) {
          container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#94a3b8;">لا توجد صور متوفرة حالياً في المعرض.</p>';
          return;
        }

        container.innerHTML = items.map(item => `
          <div class="card">
            <img src="${item.url}" alt="${item.title}" loading="lazy">
            <div class="card-body">
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${item.desc || ''}</p>
              <a href="https://wa.me/963${phone.replace(/^0/, '')}?text=مرحباً دكتور، أود الاستفسار بخصوص هذه الحالة المعروضة: ${encodeURIComponent(item.title)}" target="_blank" class="btn-wa">
                <i class="fab fa-whatsapp"></i> استشارة بخصوص هذه الحالة
              </a>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('gallery-container').innerHTML = '<p style="color:#f87171; text-align:center; grid-column:1/-1;">تعذر تحميل المعرض حالياً، يرجى المحاولة لاحقاً.</p>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
